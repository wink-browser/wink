name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; pull requests from forks never see secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: engine-${{ hashFiles('engine.lock') }}
      - name: Tools
        run: brew install ninja
      - name: Engine
        run: make bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Agents drive a headless Wink
        run: python3 -I Tests/agent_e2e.py build/Wink.app exported-tests
      - name: Keep the tests Wink exported
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exported-tests
          path: exported-tests
          retention-days: 7

  exported:
    name: Exported tests on Linux
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exported-tests
          path: exported-tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-audit --no-fund @playwright/test@1.65.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Chromium, Firefox and WebKit
        run: |
          (cd Tests/fixtures && python3 -m http.server 8765 --bind 127.0.0.1 &)
          sleep 1
          npx playwright test --config Tests/playwright.config.ts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | sed 's/gitleaks_.*/gitleaks.tgz/' | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --verbose

  signoff:
    name: Signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line (DCO)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") isn't signed off. Amend with: git commit --amend -s"
              missing=1
            fi
          done
          exit $missing
