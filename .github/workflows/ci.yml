name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; pull requests from forks never see secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: engine-${{ hashFiles('engine.lock') }}
      - name: Tools
        run: brew install ninja
      - name: Engine
        run: make bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: make
      - name: Test
        run: make test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | sed 's/gitleaks_.*/gitleaks.tgz/' | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --verbose

  signoff:
    name: Signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line (DCO)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") isn't signed off. Amend with: git commit --amend -s"
              missing=1
            fi
          done
          exit $missing
