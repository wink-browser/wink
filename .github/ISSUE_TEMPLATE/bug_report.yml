name: Bug report
description: Something in Wink doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Please don't file it here; see [SECURITY.md](https://github.com/wink-browser/wink/blob/main/SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Click …"
  - type: input
    id: version
    attributes:
      label: Wink version
      description: Wink › About Wink.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Was an agent involved?
      options: ["No", "Winky", "Claude Code", "Another MCP client"]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything personal (URLs, names, cookies) first.
