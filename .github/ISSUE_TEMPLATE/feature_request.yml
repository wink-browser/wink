name: Idea
description: Suggest something Wink should do.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the moment where Wink gets in your way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: else
    attributes:
      label: Anything else
